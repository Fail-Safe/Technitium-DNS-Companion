<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Capability routing cuts lease fan-out and stored browsing makes zero node calls</title>
  <desc id="desc">Three paired bar charts. Controlled lease refresh latency falls from 80.91 milliseconds before to 11.18 milliseconds after capability routing. Lease calls per refresh fall from three to one. Live node calls for a stored DNS Logs page fall from three to zero.</desc>
  <defs>
    <pattern id="beforePattern" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#D97932"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9A4B16" stroke-width="2"/>
    </pattern>
    <pattern id="afterPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#3B78B4"/>
      <circle cx="4" cy="4" r="1.3" fill="#173F68"/>
    </pattern>
  </defs>
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="60" y="48" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#18212B">Capability routing cuts lease fan-out; stored browsing makes zero node calls</text>
  <text x="60" y="76" font-family="Arial, sans-serif" font-size="14" fill="#4B5967">Controlled three-node model, 9 warm samples; bars start at zero</text>

  <g transform="translate(60 112)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#18212B">Lease refresh latency</text>
    <text x="0" y="23" font-family="Arial, sans-serif" font-size="13" fill="#4B5967">Milliseconds, slow inactive node model</text>
    <line x1="0" y1="260" x2="320" y2="260" stroke="#7A8793" stroke-width="1"/>
    <line x1="0" y1="80" x2="0" y2="260" stroke="#7A8793" stroke-width="1"/>
    <line x1="0" y1="215" x2="320" y2="215" stroke="#DDE2E7"/>
    <line x1="0" y1="170" x2="320" y2="170" stroke="#DDE2E7"/>
    <line x1="0" y1="125" x2="320" y2="125" stroke="#DDE2E7"/>
    <text x="-9" y="265" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4B5967">0</text>
    <text x="-9" y="220" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4B5967">20</text>
    <text x="-9" y="175" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4B5967">40</text>
    <text x="-9" y="130" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4B5967">60</text>
    <text x="-9" y="85" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4B5967">80</text>
    <rect x="60" y="78" width="72" height="182" fill="url(#beforePattern)"/>
    <rect x="190" y="235" width="72" height="25" fill="url(#afterPattern)"/>
    <text x="96" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7A3510">80.91</text>
    <text x="226" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#173F68">11.18</text>
    <text x="96" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#18212B">Before</text>
    <text x="226" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#18212B">Routed</text>
    <text x="160" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#276749">86.2% lower</text>
  </g>

  <g transform="translate(440 112)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#18212B">Lease calls per refresh</text>
    <text x="0" y="23" font-family="Arial, sans-serif" font-size="13" fill="#4B5967">Requests to Technitium nodes</text>
    <line x1="0" y1="260" x2="300" y2="260" stroke="#7A8793" stroke-width="1"/>
    <line x1="0" y1="80" x2="0" y2="260" stroke="#7A8793" stroke-width="1"/>
    <line x1="0" y1="200" x2="300" y2="200" stroke="#DDE2E7"/>
    <line x1="0" y1="140" x2="300" y2="140" stroke="#DDE2E7"/>
    <line x1="0" y1="80" x2="300" y2="80" stroke="#DDE2E7"/>
    <text x="-9" y="265" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4B5967">0</text>
    <text x="-9" y="205" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4B5967">1</text>
    <text x="-9" y="145" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4B5967">2</text>
    <text x="-9" y="85" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4B5967">3</text>
    <rect x="50" y="80" width="72" height="180" fill="url(#beforePattern)"/>
    <rect x="180" y="200" width="72" height="60" fill="url(#afterPattern)"/>
    <text x="86" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7A3510">3</text>
    <text x="216" y="189" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#173F68">1</text>
    <text x="86" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#18212B">Before</text>
    <text x="216" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#18212B">Routed</text>
    <text x="150" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#276749">66.7% fewer</text>
  </g>

  <g transform="translate(820 112)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#18212B">Node calls per stored page</text>
    <text x="0" y="23" font-family="Arial, sans-serif" font-size="13" fill="#4B5967">Historical SQLite browsing</text>
    <line x1="0" y1="260" x2="300" y2="260" stroke="#7A8793" stroke-width="1"/>
    <line x1="0" y1="80" x2="0" y2="260" stroke="#7A8793" stroke-width="1"/>
    <line x1="0" y1="200" x2="300" y2="200" stroke="#DDE2E7"/>
    <line x1="0" y1="140" x2="300" y2="140" stroke="#DDE2E7"/>
    <line x1="0" y1="80" x2="300" y2="80" stroke="#DDE2E7"/>
    <text x="-9" y="265" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4B5967">0</text>
    <text x="-9" y="205" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4B5967">1</text>
    <text x="-9" y="145" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4B5967">2</text>
    <text x="-9" y="85" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4B5967">3</text>
    <rect x="50" y="80" width="72" height="180" fill="url(#beforePattern)"/>
    <rect x="180" y="260" width="72" height="0" fill="url(#afterPattern)"/>
    <text x="86" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7A3510">3</text>
    <text x="216" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#173F68">0</text>
    <text x="86" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#18212B">Before</text>
    <text x="216" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#18212B">Stored final</text>
    <text x="150" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#276749">Network-independent</text>
  </g>

  <g transform="translate(60 505)">
    <rect x="0" y="-14" width="18" height="18" fill="url(#beforePattern)"/>
    <text x="27" y="0" font-family="Arial, sans-serif" font-size="13" fill="#18212B">All-node baseline</text>
    <rect x="170" y="-14" width="18" height="18" fill="url(#afterPattern)"/>
    <text x="197" y="0" font-family="Arial, sans-serif" font-size="13" fill="#18212B">Optimized stage</text>
    <text x="1100" y="0" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#4B5967">Source: deterministic Jest benchmark, 2026-08-29</text>
  </g>
</svg>
