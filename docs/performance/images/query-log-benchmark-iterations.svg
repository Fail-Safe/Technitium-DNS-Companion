<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Final path removes the four seconds-long DNS Logs hotspots</title>
  <desc id="chart-desc">Four small line charts show warm median query time across baseline, planner statistics, distinct count, status index, grouped dedup rewrite, and adaptive routing. Unfiltered domain dedup falls from 2.98 seconds to 136 milliseconds; per-client dedup from 3.25 seconds to 196 milliseconds; unique count from 1.68 seconds to 5 milliseconds; blocked count from 1.30 seconds to 2 milliseconds.</desc>
  <defs></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #526078; }
    .panel-title { font-size: 15px; font-weight: 650; }
    .axis { font-size: 11px; fill: #526078; }
    .value { font-size: 11px; font-weight: 650; }
    .grid { stroke: #dbe2ea; stroke-width: 1; }
  </style>
<text x="50" y="42" class="title">Final path removes the four seconds-long DNS Logs hotspots</text>
<text x="50" y="66" class="subtitle">Warm medians, 1,000,000 synthetic rows; each panel uses a zero baseline and its own labeled millisecond scale.</text>
