<text x="620.0" y="436.9" text-anchor="middle" class="value">206</text>
<rect x="649.0" y="460.2" width="42" height="79.8" fill="url(#dots-teal)" stroke="#0f766e" stroke-width="1"/>
<text x="670.0" y="453.2" text-anchor="middle" class="value">171</text>
<text x="620.0" y="564" text-anchor="middle" class="axis">google.com</text>
<text x="620.0" y="579" text-anchor="middle" class="axis">domain</text>
<rect x="761.0" y="183.9" width="42" height="356.1" fill="url(#solid-blue)" stroke="#2563eb" stroke-width="1"/>
<text x="782.0" y="176.9" text-anchor="middle" class="value">763</text>
<rect x="811.0" y="335.1" width="42" height="204.9" fill="url(#diagonal-orange)" stroke="#d97706" stroke-width="1"/>
<text x="832.0" y="328.1" text-anchor="middle" class="value">439</text>
<rect x="861.0" y="200.3" width="42" height="339.7" fill="url(#dots-teal)" stroke="#0f766e" stroke-width="1"/>
<text x="882.0" y="193.3" text-anchor="middle" class="value">728</text>
<text x="832.0" y="564" text-anchor="middle" class="axis">Phone</text>
<text x="832.0" y="579" text-anchor="middle" class="axis">client</text>
<rect x="973.0" y="418.7" width="42" height="121.3" fill="url(#solid-blue)" stroke="#2563eb" stroke-width="1"/>
<text x="994.0" y="411.7" text-anchor="middle" class="value">260</text>
<rect x="1023.0" y="418.2" width="42" height="121.8" fill="url(#diagonal-orange)" stroke="#d97706" stroke-width="1"/>
<text x="1044.0" y="411.2" text-anchor="middle" class="value">261</text>
<rect x="1073.0" y="416.8" width="42" height="123.2" fill="url(#dots-teal)" stroke="#0f766e" stroke-width="1"/>
<text x="1094.0" y="409.8" text-anchor="middle" class="value">264</text>
<text x="1044.0" y="564" text-anchor="middle" class="axis">Guest</text>
<text x="1044.0" y="579" text-anchor="middle" class="axis">client</text>
<rect x="330" y="596" width="24" height="14" fill="url(#solid-blue)" stroke="#2563eb"/>
<text x="362" y="608" class="axis">Filter-aware</text>
<rect x="540" y="596" width="24" height="14" fill="url(#diagonal-orange)" stroke="#d97706"/>
<text x="572" y="608" class="axis">Grouped for all</text>
<rect x="750" y="596" width="24" height="14" fill="url(#dots-teal)" stroke="#0f766e"/>
<text x="782" y="608" class="axis">Adaptive final</text>
</svg>
