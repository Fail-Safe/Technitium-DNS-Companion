services:
  technitium-dns-companion:
    # Production default: pull the published image. For local builds, use:
    # docker compose -f docker-compose.yml -f docker-compose.local-build.yml up -d --build
    image: ${COMPANION_IMAGE:-ghcr.io/fail-safe/technitium-dns-companion:latest}
    # Stable name retained for compatibility with existing scripts and tooling.
    container_name: technitium-dns-companion
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    ports:
      # HTTP for a TLS reverse proxy. Set COMPANION_HTTP_BIND=127.0.0.1
      # when the proxy runs directly on this host.
      - target: ${PORT:-3000}
        published: "${COMPANION_HTTP_PORT:-3000}"
        host_ip: "${COMPANION_HTTP_BIND:-0.0.0.0}"
      # Direct HTTPS, including the automatic self-signed default.
      - target: ${HTTPS_PORT:-3443}
        published: "${COMPANION_HTTPS_PORT:-3443}"
        host_ip: "${COMPANION_HTTPS_BIND:-0.0.0.0}"

    # Application configuration lives in .env. Copy .env.example to .env;
    # that file is the complete, commented variable reference. The example
    # file also supplies backward-compatible defaults, and .env overrides it.
    # At minimum, configure:
    #   TECHNITIUM_NODES=node1,node2
    #   TECHNITIUM_NODE1_BASE_URL=https://dns-primary.example.com:53443
    #   TECHNITIUM_NODE2_BASE_URL=https://dns-secondary.example.com:53443
    env_file:
      - .env.example
      - path: .env
        required: false

    # Fixed container behavior only; user-configurable values belong in .env.
    environment:
      NODE_ENV: production

    # Persistent application state. Compose creates ./data if it is absent.
    volumes:
      - type: bind
        source: ./data
        target: /data
      # Compatibility alias for existing .env paths under /app/config.
      - type: bind
        source: ./data
        target: /app/config
      # Optional: mount SSL certificates (if using HTTPS)
      # - ./certs:/app/certs:ro

    logging:
      driver: json-file
      options:
        max-size: "${COMPANION_LOG_MAX_SIZE:-10m}"
        max-file: "${COMPANION_LOG_MAX_FILES:-3}"

    # Stable network retained for compatibility with reverse proxies and peers.
    networks:
      - technitium-dns-companion-network

    # Resource limits (optional)
    # Sizing note:
    # - Production should use less memory than the dev container (no Vite/HMR).
    # - However, large blocklists / domain-list caching can legitimately increase baseline RAM.
    # - If you enforce a hard limit that is too low, the Node process may be OOM-killed.
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  technitium-dns-companion-network:
    driver: bridge
